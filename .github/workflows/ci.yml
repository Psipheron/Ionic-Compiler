name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-14      # Apple Silicon; matches primary dev environment

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install system deps
        run: brew install llvm

      # ── Rust cross-OS bootstrap ──────────────────────────────────────────
      # `cargo build --release` produces target/release/ionic — a complete
      # Rust/LLVM-based Ionic compiler that can build user programs on any
      # OS with Rust + clang installed (Linux ARM64, macOS, Windows). This
      # is the path used by future cross-OS CI; the committed ionic_self
      # and ./build.sh handle the self-hosted compiler for now.
      - name: Build Rust compiler
        run: cargo build --release

      - name: Smoke test — hello world (Rust compiler)
        run: |
          echo 'fn main() -> int64 { print("ok"); return 0; }' > /tmp/hi.ionic
          ./target/release/ionic /tmp/hi.ionic -o /tmp/hi
          output=$(/tmp/hi)
          [ "$output" = "ok" ] || (echo "Expected 'ok', got '$output'"; exit 1)

      - name: Smoke test — arithmetic (Rust compiler)
        run: |
          cat > /tmp/arith.ionic << 'EOF'
          fn main() -> int64 {
              let x = 6 * 7;
              print(int64_to_str(x));
              return 0;
          }
          EOF
          ./target/release/ionic /tmp/arith.ionic -o /tmp/arith
          output=$(/tmp/arith)
          [ "$output" = "42" ] || (echo "Expected '42', got '$output'"; exit 1)

      - name: Smoke test — standard library (Rust compiler)
        run: |
          ./target/release/ionic examples/stdlib_test.ionic -o /tmp/stdlib_test
          /tmp/stdlib_test | grep -q "arr_sum = 100" || (echo "arr_sum check failed"; exit 1)
          /tmp/stdlib_test | grep -q "contains: ok"  || (echo "contains check failed"; exit 1)

      # ── Source-only bootstrap closed loop ────────────────────────────────
      # With bitwise operators and relative-import splicing in the Rust
      # frontend, `cargo build --release` alone can compile the self-hosted
      # sources — no committed ionic_self required. The freshly built compiler
      # must then itself work.
      - name: Rust bootstrap compiles the self-hosted sources
        run: |
          ./target/release/ionic src/main.ionic -o /tmp/ionic_from_rust
          echo 'fn main() -> int64 { print(int64_to_str(6 & 3)); return 0; }' > /tmp/bw.ionic
          /tmp/ionic_from_rust /tmp/bw.ionic -o /tmp/bw
          [ "$(/tmp/bw)" = "2" ] || (echo "bootstrapped compiler failed on a bitwise program"; exit 1)

      # ── Self-hosted bootstrap ────────────────────────────────────────────
      # Build ionic_new from the split .ionic sources using the committed
      # ionic_self binary. This is the self-hosting path used by releases.
      - name: Build self-hosted compiler
        run: ./build.sh

      # The bootstrap binary and the freshly self-hosted compiler must emit an
      # identical object file for the same sources. Compares .o, not the linked
      # binary (the linker always stamps a fresh LC_UUID + code signature).
      - name: Verify self-hosting (object files byte-identical)
        run: ./build.sh --verify-self-hosting

      # ── RSS regression gate (ADVISORY during memory-model rollout) ───────
      # Smallest-possible-RSS is a core language goal. scripts/rss_check.sh
      # compiles a string-churn benchmark at two sizes and fails if peak RSS
      # grows with N (a leaking allocator grows ~48 B/iter; a correct one is
      # flat). It currently FAILS by design: the runtime still leaks, so this
      # records the baseline and gives the ownership work a number to defend.
      # `continue-on-error` keeps CI green for unrelated work and shows a red
      # step so the leak stays visible. When the memory model lands, delete
      # `continue-on-error` to make this a hard gate.
      - name: RSS regression gate (advisory until memory model lands)
        continue-on-error: true
        run: ./scripts/rss_check.sh

      - name: Smoke test — hello world (self-hosted compiler)
        run: |
          echo 'fn main() -> int64 { print("ok"); return 0; }' > /tmp/hi2.ionic
          ./ionic_new /tmp/hi2.ionic -o /tmp/hi2
          output=$(/tmp/hi2)
          [ "$output" = "ok" ] || (echo "Expected 'ok', got '$output'"; exit 1)

      - name: Smoke test — arithmetic (self-hosted compiler)
        run: |
          cat > /tmp/arith2.ionic << 'EOF'
          fn main() -> int64 {
              let x = 6 * 7;
              print(int64_to_str(x));
              return 0;
          }
          EOF
          ./ionic_new /tmp/arith2.ionic -o /tmp/arith2
          output=$(/tmp/arith2)
          [ "$output" = "42" ] || (echo "Expected '42', got '$output'"; exit 1)

      - name: Smoke test — standard library (self-hosted compiler)
        run: |
          ./ionic_new examples/stdlib_test.ionic -o /tmp/stdlib_test2
          /tmp/stdlib_test2 | grep -q "arr_sum = 100" || (echo "arr_sum check failed"; exit 1)
          /tmp/stdlib_test2 | grep -q "contains: ok"  || (echo "contains check failed"; exit 1)

      # ── Packaging: the released tarball must be standalone ───────────────
      # Mirrors release.yml's packaging step, then extracts to a throwaway
      # directory and compiles a program importing std.* from an unrelated
      # CWD. This guards the exe-relative $IONIC_ROOT resolution: without the
      # bundled lib/ and src/ionic_model_runtime.c, the installed binary would
      # be unable to compile anything.
      - name: Packaged tarball works standalone (exe-relative runtime + stdlib)
        run: |
          STAGE=/tmp/ionic-pkg/ionic-vTEST-aarch64-apple-darwin
          rm -rf /tmp/ionic-pkg && mkdir -p "$STAGE/lib" "$STAGE/src"
          cp ionic_new "$STAGE/ionic"
          cp README.md "$STAGE/"
          cp -R lib/. "$STAGE/lib/"
          cp src/ionic_model_runtime.c "$STAGE/src/"
          ( cd /tmp/ionic-pkg && tar -czf ionic-vTEST.tar.gz "$(basename $STAGE)" )
          rm -rf /tmp/ionic-extract && mkdir /tmp/ionic-extract
          tar -xzf /tmp/ionic-pkg/ionic-vTEST.tar.gz -C /tmp/ionic-extract
          cat > /tmp/pkg_prog.ionic << 'EOF'
          import std.math;
          import std.str;
          fn main() -> int64 {
              println(str_concat("sqrt2=", float64_to_str(sqrt(2.0))));
              println(str_concat("trim='", str_concat(trim("  hi  "), "'")));
              return 0;
          }
          EOF
          # Run from /tmp (NOT the repo root) so the repo-relative fallback can't help.
          ( cd /tmp && /tmp/ionic-extract/ionic-vTEST-aarch64-apple-darwin/ionic \
              /tmp/pkg_prog.ionic -o /tmp/pkg_prog )
          out=$(/tmp/pkg_prog)
          echo "$out"
          echo "$out" | grep -q "sqrt2=1.41421" || (echo "stdlib math failed"; exit 1)
          echo "$out" | grep -q "trim='hi'"    || (echo "stdlib str failed"; exit 1)

      - name: Smoke test — global/param shadowing in recursion (self-hosted)
        run: |
          # Regression: a top-level `let n = <int>` becomes an inlined
          # compile-time constant. A function parameter of the same name must
          # still shadow it, or `rec(n - 1)` reads the constant forever and the
          # recursion guard never fires (stack-overflow / SIGSEGV).
          cat > /tmp/shadow.ionic << 'EOF'
          let n = 10;
          fn rec(int64 n) -> int64 { if (n <= 1) { return 1; } return rec(n - 1); }
          print(rec(5));
          EOF
          ./ionic_new /tmp/shadow.ionic -o /tmp/shadow
          output=$(/tmp/shadow)
          [ "$output" = "1" ] || (echo "Expected '1', got '$output'"; exit 1)

      # ── Hardware-placement tags (@gpu fn / @cpu fn) ──────────────────────
      # An @gpu fn body must be checked as GPU context (same rules as a
      # gpu { } block): CPU-only I/O and tensor@cpu values are rejected, and
      # @cpu functions may not be called from it.
      - name: Hardware tags — @gpu/@cpu fn accepted (self-hosted compiler)
        run: |
          ./ionic_new examples/hw_tags.ionic -o /tmp/hw_tags
          /tmp/hw_tags | grep -q "42" || (echo "hw_tags run check failed"; exit 1)

      - name: Hardware tags — @gpu fn violations rejected (self-hosted compiler)
        run: |
          if ./ionic_new examples/hw_tag_error.ionic -o /tmp/hw_tag_err 2>/dev/null; then
            echo "Expected hw_tag_error.ionic to be rejected, but it compiled"; exit 1
          fi
          ./ionic_new examples/hw_tag_error.ionic -o /tmp/hw_tag_err 2>&1 \
            | grep -q "CPU-only I/O" || (echo "missing GPU-context diagnostic"; exit 1)

      # ── ML backends: MLX surface + graceful degradation ──────────────────
      # Two things must hold regardless of what is installed on the runner:
      #   1. The runtime compiles with and without IONIC_HAVE_MLX.
      #   2. Both variants export the *same* set of ionic_mlx_* symbols, so an
      #      Ionic program that mentions mlx_* links on every platform and
      #      degrades to "not compiled in" at runtime rather than failing to
      #      link. A missing stub is a link error, hence the parity check.
      - name: MLX runtime compiles both ways with identical symbol sets
        run: |
          clang -c src/ionic_model_runtime.c -o /tmp/rt_stub.o
          nm -gU /tmp/rt_stub.o | awk '{print $3}' | grep '^_ionic_mlx_' | sort > /tmp/syms_stub.txt

          if [ -f /opt/homebrew/include/mlx/c/mlx.h ] || [ -f /usr/local/include/mlx/c/mlx.h ]; then
            clang -c src/ionic_model_runtime.c -DIONIC_HAVE_MLX \
              -I/opt/homebrew/include -I/usr/local/include -o /tmp/rt_mlx.o
            nm -gU /tmp/rt_mlx.o | awk '{print $3}' | grep '^_ionic_mlx_' | sort > /tmp/syms_mlx.txt
            if ! diff -u /tmp/syms_mlx.txt /tmp/syms_stub.txt; then
              echo "MLX stub and real builds export different symbol sets"; exit 1
            fi
            echo "MLX available: symbol sets match ($(wc -l < /tmp/syms_mlx.txt | tr -d ' ') symbols)"
          else
            echo "mlx-c not installed on this runner; stub-only check"
          fi

          # The stub must actually link and degrade, not crash.
          cat > /tmp/mlx_degrade.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern int64_t ionic_mlx_available(void);
          extern void *ionic_mlx_matmul(void*, void*);
          int main(void) {
            if (ionic_mlx_available() != 0) return 1;
            if (ionic_mlx_matmul(0, 0) != 0) return 1;
            return 0;
          }
          EOF
          clang /tmp/mlx_degrade.c /tmp/rt_stub.o -lm -o /tmp/mlx_degrade
          /tmp/mlx_degrade 2>/dev/null || (echo "MLX stub did not degrade cleanly"; exit 1)

      # End-to-end: when mlx-c is present, compile and run real GPU math from
      # Ionic source (through the self-hosted compiler).
      - name: MLX end-to-end (self-hosted compiler, Apple silicon)
        run: |
          if [ ! -f /opt/homebrew/include/mlx/c/mlx.h ]; then
            echo "mlx-c not installed; skipping end-to-end MLX test"; exit 0
          fi
          cat > /tmp/mlx_e2e.ionic <<'EOF'
          fn main() -> int64 {
              if (mlx_available() == 0) { println("unavailable"); return 1; }
              let a = mlx_arange(0.0, 4.0, 1.0, 0);
              let b = mlx_reshape(a, [2, 2]);
              let c = mlx_matmul(b, b);
              let out = mlx_to_array(c);
              println(float64_to_str(out[0]));
              println(float64_to_str(out[3]));
              mlx_free(c); mlx_free(b); mlx_free(a);
              return 0;
          }
          EOF
          ./ionic_new /tmp/mlx_e2e.ionic -o /tmp/mlx_e2e
          /tmp/mlx_e2e > /tmp/mlx_e2e.out
          # [[0,1],[2,3]]^2 = [[2,3],[6,11]]
          grep -qx "2" /tmp/mlx_e2e.out || (echo "wrong matmul output"; cat /tmp/mlx_e2e.out; exit 1)
          grep -qx "11" /tmp/mlx_e2e.out || (echo "wrong matmul output"; cat /tmp/mlx_e2e.out; exit 1)

      # Regression guard for the float-argument ABI and for the ops that take a
      # scalar or an axis. Ionic passes float64 as a bit pattern in a GP
      # register, so an entry point declared with `double` silently reads the
      # wrong register and produces garbage (mlx_arange used to fail with
      # "step must be nonzero"). These values are exact in f32, so equality is
      # a fair check.
      - name: MLX scalar-argument and axis ops
        run: |
          if [ ! -f /opt/homebrew/include/mlx/c/mlx.h ]; then
            echo "mlx-c not installed; skipping scalar-argument test"; exit 0
          fi
          cat > /tmp/mlx_scalar.ionic <<'EOF'
          fn main() -> int64 {
              if (mlx_available() == 0) { println("unavailable"); return 1; }
              // scalar float args (mlx_full / mlx_arange / mlx_rms_norm)
              let f = mlx_full([2], 3.5, 0);
              println(float64_to_str(mlx_item(mlx_slice(f, 1, 2, 0))));
              println(int64_to_str(mlx_size(mlx_arange(0.0, 6.0, 1.0, 0))));
              // axis args (mlx_concatenate / mlx_argmax)
              let a = mlx_reshape(mlx_arange(0.0, 4.0, 1.0, 0), [2, 2]);
              println(int64_to_str(mlx_dim(mlx_concatenate(a, a, 1), 1)));
              let m = mlx_reshape(mlx_from_array([1.0, 9.0, 3.0], [3], 0), [1, 3]);
              println(float64_to_str(mlx_item(mlx_argmax(m, 1, 0))));
              mlx_free(f); mlx_free(a); mlx_free(m);
              return 0;
          }
          EOF
          ./ionic_new /tmp/mlx_scalar.ionic -o /tmp/mlx_scalar
          /tmp/mlx_scalar > /tmp/mlx_scalar.out
          expect() {
            grep -qx "$1" /tmp/mlx_scalar.out || {
              echo "expected '$1' ($2)"; cat /tmp/mlx_scalar.out; exit 1
            }
          }
          expect 3.5 "mlx_full/mlx_slice scalar float arg"
          expect 6   "mlx_arange float args"
          expect 4   "mlx_concatenate axis arg (2x2 ++ 2x2 on axis 1)"
          expect 1   "mlx_argmax + mlx_item dtype dispatch"

      # Backends must be linked only on demand: hello-world must not drag in
      # mlx/llama/onnx (that would add load + init cost to every binary).
      - name: Backend linkage is usage-gated
        run: |
          ./ionic_new examples/hello.ionic -o /tmp/hello_gate
          n=$(otool -L /tmp/hello_gate | grep -Eic 'mlx|llama|onnx')
          if [ "$n" != "0" ]; then
            echo "hello-world unexpectedly links $n ML libs"; otool -L /tmp/hello_gate; exit 1
          fi

      # ── Tree-sitter grammar ──────────────────────────────────────────────
      # The grammar/queries are derived from the language; make sure the
      # committed parser is in sync with grammar.js and that everything still
      # parses (catches drift after syntax changes).
      - name: Tree-sitter grammar parses the sources
        run: |
          npm install -g tree-sitter-cli
          cd tree-sitter-ionic
          tree-sitter generate
          git diff --exit-code -- src \
            || (echo "src/ is stale — run 'tree-sitter generate' and commit"; exit 1)
          for f in ../examples/*.ionic ../lib/std/*.ionic ../src/*.ionic ../src/*/*.ionic; do
            if tree-sitter parse "$f" 2>/dev/null | grep -qE 'ERROR|MISSING'; then
              echo "parse error in $f"; exit 1
            fi
          done
          tree-sitter query queries/highlights.scm ../examples/hw_tags.ionic >/dev/null
