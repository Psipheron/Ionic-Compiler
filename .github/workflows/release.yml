name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-latest   # Apple Silicon (arm64) — only target supported

    steps:
      - uses: actions/checkout@v4

      - name: Make bootstrap binary executable
        run: chmod +x ionic_self

      - name: Build ionic_new from split sources
        run: ./build.sh

      - name: Verify self-hosting (object files byte-identical)
        run: ./build.sh --verify-self-hosting

      # Was previously skipped with a note that the self-hosted rebuild "hangs
      # in sc_program's top-stmt traversal". It does not: the check completes in
      # ~2 s and the object files match. Re-enabling it means a release cannot
      # ship a compiler that no longer reproduces itself, which is the property
      # the whole self-hosting claim rests on.

      # ── The version the tarball advertises must be the version it contains ──
      # The tarball name comes from `github.ref_name` (the tag), but the binary
      # inside takes its version from src/main.ionic and Cargo.toml. Those are
      # independent, so a tag can ship a binary that misreports itself — which
      # is exactly what happened between v0.2.1 and the 0.3.0 bump: the sources
      # said 0.1.0, and nothing compared that to the tag.
      #
      # ci.yml does not cover this. It runs on pushes to `main` and on pull
      # requests; a tag push matches neither, so a release would be built and
      # published with no version check at all. cli_check.sh's tag assertion is
      # only load-bearing if something invokes it on the tagged commit, and this
      # is that something. It exits non-zero on a mismatch, failing the job
      # before the tarball is built.
      - name: Assert tag, sources and --version agree
        env:
          # Without this the tag comparison is skipped whenever HEAD is not
          # exactly a tag — which in this job would mean the check silently did
          # nothing. A release runs on a tag by definition, so demand one.
          CLI_REQUIRE_TAG: "1"
        run: ./scripts/cli_check.sh

      # ── The gates that decide whether this tag ships ──────────────────────
      #
      # These live in ci.yml and nowhere else, and ci.yml triggers on pushes to
      # `main` and on pull requests. A tag push matches neither, and a release
      # can legitimately be cut from a maintenance branch — v0.3.1 was, from
      # release/0.3 — so a tag can reach this job having run none of them. That
      # is not hypothetical: v0.3.1 shipped with zero gates executed, and
      # v0.3.0 shipped a stdlib that returned wrong answers for every statistic.
      #
      # The fix is not "remember to merge to main first". A release job that
      # assumes something outside itself ran is a release job that can ship
      # anything. So the gates run here, against the exact tree being packaged.
      #
      # Ordering: cheapest and most fundamental first, so an obvious break
      # fails in seconds rather than after the RSS benchmarks.
      #
      # These are the *native* gates only. `ionic_new` is what the tarball
      # ships; the Rust bootstrap is a separate cross-OS path with its own
      # coverage in ci.yml, and testing it here would mean installing a
      # toolchain this job otherwise does not need.
      - name: Gate — producer ownership contract (RC)
        run: ./scripts/rc_check.sh

      - name: Gate — array RC aliasing and escapes
        run: ./scripts/arr_rc_check.sh

      - name: Gate — runtime conformance (I/O, print, struct globals, stdlib)
        run: ./scripts/io_check.sh

      - name: Gate — CLI surface
        run: ./scripts/cli_check.sh

      - name: Gate — model RAII
        run: ./scripts/model_raii_check.sh

      - name: Gate — hardware placement
        run: ./scripts/placement_check.sh

      - name: Gate — RSS regression
        run: ./scripts/rss_check.sh

      - name: Package tarball
        run: |
          VERSION="${{ github.ref_name }}"
          ARCH="aarch64-apple-darwin"
          STAGING="ionic-${VERSION}-${ARCH}"
          mkdir -p "${STAGING}"

          cp ionic_new "${STAGING}/ionic"
          cp README.md "${STAGING}/"
          # MIT requires the copyright + permission notice to travel with every
          # copy. The tarball ships the runtime source that gets compiled into
          # users' programs, so the notice has to be in the tarball itself.
          cp LICENSE "${STAGING}/"

          # Ship the runtime C source + the bundled standard library so the
          # installed `ionic` can compile user programs from any directory.
          # The binary locates these relative to itself via $IONIC_ROOT
          # (the executable's own directory, published by the C runtime).
          mkdir -p "${STAGING}/lib"
          cp -R lib/. "${STAGING}/lib/"
          mkdir -p "${STAGING}/src"
          cp src/ionic_model_runtime.c "${STAGING}/src/"

          tar -czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "${STAGING}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-aarch64-apple-darwin
          path: "*.tar.gz"

      # ── Test the artifact, not the source tree ─────────────────────────────
      #
      # Every gate above runs `ionic_new` out of the repo, where lib/ and
      # src/ionic_model_runtime.c sit in their usual places. A tarball can
      # still be wrong: the packaging step assembles a different directory
      # layout, and the installed compiler finds the standard library and
      # runtime by resolving its *own path* ($IONIC_ROOT). A release whose
      # tarball omitted lib/, or put it one level off, would pass every gate
      # and fail for every user.
      #
      # This is also the specific check that was missing when v0.3.0 shipped a
      # stdlib whose statistics dropped the first element: the sources were
      # fixed after the tag was cut, and nothing ever ran the packaged binary
      # against a stdlib call. Extracting to /tmp and compiling from `/` means
      # no repo-relative fallback can rescue it.
      - name: Smoke test — the packaged tarball compiles and runs standalone
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          rm -rf /tmp/relcheck && mkdir -p /tmp/relcheck
          tar -xzf "${{ env.TARBALL }}" -C /tmp/relcheck
          ROOT="/tmp/relcheck/$(basename "${{ env.TARBALL }}" .tar.gz)"

          # The shipped binary must report the version its tag advertises.
          #
          # `TAG` comes from the expression, not from a shell variable set in an
          # earlier step: `VERSION` in `Package tarball` was step-local and never
          # reached this one, so an earlier version of this check compared
          # against the empty string and failed on a correct artifact. A release
          # gate that fails on good input is worse than no gate, because the
          # next person disables it.
          GOT="$("$ROOT/ionic" --version)"
          WANT="${TAG#v}"
          if [ "$GOT" != "$WANT" ]; then
            echo "packaged binary reports '$GOT', tag is '$WANT'"
            exit 1
          fi

          # Exercise the bundled standard library from an unrelated CWD. The
          # expected values are the ones the stdlib contract promises, so this
          # fails if the tarball's lib/ is stale, missing, or not found.
          cat > /tmp/relcheck/probe.ionic <<'EOF'
          import std.array.*;
          import std.data.*;
          import std.text.*;
          fn main() -> int64 {
              let a = [1.0, 2.0, 3.0, 4.0];
              println(str_concat("mean=", float64_to_str(mean_f(a))));
              println(str_concat("csv=", to_csv_line(a)));
              let n = [10, 20, 30];
              println(str_concat("revlen=", int64_to_str(len(arr_reverse(n)))));
              let s = ["a", "b", "c"];
              println(str_concat("join=", join(s, ",")));
              return 0;
          }
          EOF

          ( cd / && "$ROOT/ionic" /tmp/relcheck/probe.ionic -o /tmp/relcheck/probe )
          OUT="$(/tmp/relcheck/probe)"
          echo "$OUT"
          printf '%s\n' "$OUT" | grep -qx "mean=2.5"    || (echo "stdlib mean wrong in tarball"; exit 1)
          printf '%s\n' "$OUT" | grep -qx "csv=1,2,3,4" || (echo "stdlib csv wrong in tarball"; exit 1)
          printf '%s\n' "$OUT" | grep -qx "revlen=3"    || (echo "arr_reverse wrong in tarball"; exit 1)
          printf '%s\n' "$OUT" | grep -qx "join=a,b,c"  || (echo "join wrong in tarball"; exit 1)

      - name: Save checksum
        run: |
          echo "${{ env.SHA256 }}  ${{ env.TARBALL }}" > checksum-aarch64-apple-darwin.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-aarch64-apple-darwin
          path: checksum-aarch64-apple-darwin.txt

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload assets
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"

          # A tag containing a hyphen is a prerelease (v1.0.0-beta.1). Two things
          # must not happen to one: it must not be marked "latest", and it must
          # not move the Homebrew formula, or `brew install ionic` on every
          # machine starts tracking a beta. GitHub treats a release with
          # --prerelease as non-latest, and the tap job below keys off the same
          # flag.
          case "$VERSION" in
            *-*) PRERELEASE=1 ;;
            *)   PRERELEASE=0 ;;
          esac

          if [ "$PRERELEASE" = "1" ]; then
            echo "Tag '$VERSION' has a hyphen: publishing as a prerelease."
            gh release create "$VERSION" \
              --title "Ionic $VERSION (beta)" \
              --prerelease \
              --notes "> **Beta.** This is a pre-release: it is published for testing and is not the recommended version. Use v0.3.0 for a stable install.\n\n$(git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:'- %s' 2>/dev/null || echo 'Initial release')" \
              dist/tarball-aarch64-apple-darwin/*.tar.gz
          else
            gh release create "$VERSION" \
              --title "Ionic $VERSION" \
              --notes "$(git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:'- %s' 2>/dev/null || echo 'Initial release')" \
              dist/tarball-aarch64-apple-darwin/*.tar.gz
          fi

          # Consumed by anything downstream that must differ for a beta.
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  update-tap:
    name: Update Homebrew tap
    needs: publish-release
    runs-on: ubuntu-latest

    # Never move the formula for a prerelease. `brew install ionic` resolves the
    # formula's single stable URL, so pointing it at a beta would hand every
    # user a pre-release build without them asking for one. The version string
    # is the check, not the publish job's output, so this stays correct even if
    # the two jobs are ever split across workflows.
    if: ${{ !contains(github.ref_name, '-') }}

    # Dispatches a `new-release` event to the homebrew tap, where
    # `.github/workflows/update-formula.yml` rewrites Formula/ionic.rb with the
    # new version + SHA256.
    #
    # This step used to report success while doing nothing. Three independent
    # things were wrong, and because `curl` exits 0 on an HTTP error the job
    # stayed green through all of them:
    #
    #   1. The response was `401 Bad credentials` — TAP_TOKEN was missing or
    #      expired — and nothing checked the status.
    #   2. The receiving workflow lived at `workflows/update-formula.yml`, with
    #      no leading dot, so GitHub never registered it. A successful dispatch
    #      would still have updated nothing.
    #   3. The tap formula had no `version` line, and pinned the version inside
    #      a literal release URL, so the updater's `version "vX.Y.Z"` rewrite
    #      matched nothing even when it did run.
    #
    # The result was that `brew install` served v0.2.1 through four later
    # releases. So this step now: uses `gh api`, which fails the step on a
    # non-2xx response; verifies the dispatch was accepted rather than trusting
    # curl's exit code; and then *reads the formula back* and fails unless it
    # actually names this version. The last part is the only one that proves the
    # tap moved, because 2 and 3 fail silently downstream of a valid dispatch.
    #
    # NOTE: fixing 2 and 3 is a change in the *tap* repository, not here — the
    # workflow file must be moved to `.github/workflows/` there. The read-back
    # below is what makes that requirement visible instead of silent: until it
    # is done, this job fails loudly, which is the correct behaviour for "the
    # thing we claim to update did not update".
    steps:
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Read checksum
        run: |
          ARM_LINE=$(cat dist/checksum-aarch64-apple-darwin/checksum-aarch64-apple-darwin.txt)
          echo "SHA256_ARM=$(echo $ARM_LINE | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Trigger tap update
        env:
          # `gh api` reads GH_TOKEN. TAP_TOKEN must carry the `workflow` scope
          # (a plain repo-scoped PAT cannot write under .github/workflows/).
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TAP_TOKEN is not set; the tap cannot be updated." >&2
            exit 1
          fi

          # `gh api` exits non-zero on a non-2xx response, which `curl` did not.
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository_owner }}/homebrew-ionic/dispatches" \
            -f event_type=new-release \
            -f client_payload[version]="$VERSION" \
            -f client_payload[sha256_arm]="${{ env.SHA256_ARM }}"

          echo "Dispatch accepted for $VERSION."

      # A 204 from the dispatches endpoint means "event queued", not "formula
      # rewritten" — the receiving workflow runs asynchronously. Poll the formula
      # until it names the new version, so a job that reports success has
      # evidence the tap actually moved.
      - name: Verify the formula now names this version
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          DEADLINE=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            FORMULA=$(gh api "repos/${{ github.repository_owner }}/homebrew-ionic/contents/Formula/ionic.rb" \
                        --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)
            if printf '%s' "$FORMULA" | grep -q "releases/download/${VERSION}/"; then
              echo "Tap formula now points at ${VERSION}."
              exit 0
            fi
            sleep 10
          done

          echo "Tap formula does not reference ${VERSION} after 3 minutes." >&2
          echo "The dispatch was accepted, so the receiving workflow either is not" >&2
          echo "registered (.github/workflows/update-formula.yml in the tap) or" >&2
          echo "cannot rewrite the formula." >&2
          exit 1
