name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-latest   # Apple Silicon (arm64) — only target supported

    steps:
      - uses: actions/checkout@v4

      - name: Make bootstrap binary executable
        run: chmod +x ionic_self

      - name: Build ionic_new from split sources
        run: ./build.sh

      - name: Verify self-hosting (object files byte-identical)
        run: ./build.sh --verify-self-hosting

      # Was previously skipped with a note that the self-hosted rebuild "hangs
      # in sc_program's top-stmt traversal". It does not: the check completes in
      # ~2 s and the object files match. Re-enabling it means a release cannot
      # ship a compiler that no longer reproduces itself, which is the property
      # the whole self-hosting claim rests on.

      - name: Package tarball
        run: |
          VERSION="${{ github.ref_name }}"
          ARCH="aarch64-apple-darwin"
          STAGING="ionic-${VERSION}-${ARCH}"
          mkdir -p "${STAGING}"

          cp ionic_new "${STAGING}/ionic"
          cp README.md "${STAGING}/"
          # MIT requires the copyright + permission notice to travel with every
          # copy. The tarball ships the runtime source that gets compiled into
          # users' programs, so the notice has to be in the tarball itself.
          cp LICENSE "${STAGING}/"

          # Ship the runtime C source + the bundled standard library so the
          # installed `ionic` can compile user programs from any directory.
          # The binary locates these relative to itself via $IONIC_ROOT
          # (the executable's own directory, published by the C runtime).
          mkdir -p "${STAGING}/lib"
          cp -R lib/. "${STAGING}/lib/"
          mkdir -p "${STAGING}/src"
          cp src/ionic_model_runtime.c "${STAGING}/src/"

          tar -czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "${STAGING}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-aarch64-apple-darwin
          path: "*.tar.gz"

      - name: Save checksum
        run: |
          echo "${{ env.SHA256 }}  ${{ env.TARBALL }}" > checksum-aarch64-apple-darwin.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-aarch64-apple-darwin
          path: checksum-aarch64-apple-darwin.txt

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"

          gh release create "$VERSION" \
            --title "Ionic $VERSION" \
            --notes "$(git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:'- %s' 2>/dev/null || echo 'Initial release')" \
            dist/tarball-aarch64-apple-darwin/*.tar.gz

  update-tap:
    name: Update Homebrew tap
    needs: publish-release
    runs-on: ubuntu-latest

    # Dispatches a `new-release` event to ByteTheBait/homebrew-ionic, where
    # an update-formula.yml workflow at `.github/workflows/update-formula.yml`
    # rewrites Formula/ionic.rb with the new version + SHA256.
    # IMPORTANT: GitHub requires the receiving workflow file to live under
    # `.github/workflows/` *and* to be on the default branch at dispatch
    # time. Older releases of this tap had `workflows/update-formula.yml`
    # (no leading dot) which GitHub Actions ignored. After pasting the file
    # at `.github/workflows/update-formula.yml` (PAT or GitHub.com UI — the
    # `workflow` OAuth scope is required to write to that path), the tap
    # updates automatically on every tagged release.

    steps:
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Read checksum
        run: |
          ARM_LINE=$(cat dist/checksum-aarch64-apple-darwin/checksum-aarch64-apple-darwin.txt)
          echo "SHA256_ARM=$(echo $ARM_LINE | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Trigger tap update
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          curl -X POST \
            -H "Authorization: token $TAP_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/homebrew-ionic/dispatches \
            -d "{
              \"event_type\": \"new-release\",
              \"client_payload\": {
                \"version\": \"$VERSION\",
                \"sha256_arm\": \"${{ env.SHA256_ARM }}\"
              }
            }"
