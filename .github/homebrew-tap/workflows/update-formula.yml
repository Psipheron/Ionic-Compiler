name: Update formula

# Triggered by the Ionic-Compiler release workflow via repository_dispatch.
#
# IMPORTANT: this file must live at `.github/workflows/update-formula.yml`.
# GitHub only registers workflows under a leading-dot `.github/` directory; an
# older copy sat at `workflows/update-formula.yml` (no dot) and was therefore
# never loaded, so dispatches were accepted and silently did nothing.
#
# What this rewrites
# ------------------
# The version is pinned in a literal release URL, because that is what Homebrew
# resolves and what the main repo's release job polls for. The formula once had
# no `version` line at all, so an updater that rewrote `version "vX.Y.Z"`
# matched nothing.
#
# The rewrite is URL-driven rather than line-driven: it finds the release URL,
# builds the new one from it, and replaces it together with its sha256. That
# works for both a literal and an interpolated URL, and it is idempotent —
# running it twice for the same version changes nothing.
#
# The owner/repo prefix is *not* taken from the existing URL. The formula was
# seeded pointing at `ByteTheBait/Ionic-Compiler`, a former name of the repo;
# that name redirects, so the stale URL still resolves and nothing looks
# broken, while every later version inherits the dead prefix. The payload's
# `source_repo` field is the source of truth, and both the release URL and the
# `homepage` are rewritten to it. It is required: there is no fallback to the
# old URL, because falling back is exactly what preserved the stale owner.
#
# Fails loudly
# ------------
# If the formula cannot be rewritten, this workflow exits non-zero. The main
# repo's release job polls the formula afterwards and also fails, so a tap that
# did not move can never look like a success.

on:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate dispatch payload
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA_ARM: ${{ github.event.client_payload.sha256_arm }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$SHA_ARM" ]; then
            echo "Dispatch is missing version or sha256_arm." >&2
            echo "version='$VERSION' sha256_arm='$SHA_ARM'" >&2
            exit 1
          fi
          # Required, and not defaulted to the existing formula URL: the seeded
          # formula names a former owner of the repo (`ByteTheBait`), which
          # redirects, so inheriting it silently kept every later release on the
          # dead prefix.
          case "$SOURCE_REPO" in
            */*) ;;
            *) echo "Dispatch is missing source_repo (owner/repo)." >&2; exit 1 ;;
          esac
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Refusing to publish non-version tag '$VERSION'." >&2; exit 1 ;;
          esac
          case "$SHA_ARM" in
            [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]*) ;;
            *) echo "sha256_arm does not look like a sha256: '$SHA_ARM'" >&2; exit 1 ;;
          esac
          # A prerelease must never move the stable formula.
          case "$VERSION" in
            *-*) echo "Refusing to point the stable formula at prerelease '$VERSION'." >&2; exit 1 ;;
          esac

      - name: Rewrite formula to the dispatched version
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA_ARM: ${{ github.event.client_payload.sha256_arm }}
          # The *source* repository, e.g. `Psipheron/Ionic-Compiler`. Required:
          # without it the URL's owner can only be inherited from whatever the
          # formula already said, which is how the stale `ByteTheBait` prefix
          # survived — a redirecting URL looks healthy, so nothing complained
          # while every release kept publishing under the old name.
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
        run: |
          python3 - <<'PYEOF'
          import os, re, pathlib, sys

          version     = os.environ["VERSION"]
          sha_arm     = os.environ["SHA_ARM"]
          source_repo = os.environ.get("SOURCE_REPO", "").strip()

          # No fallback to the existing URL. A missing owner is a broken
          # dispatch, and guessing is what caused the drift in the first place.
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", source_repo):
              sys.exit(
                  "dispatch is missing a usable source_repo "
                  f"(got {source_repo!r}); refusing to guess the owner"
              )

          path = pathlib.Path("Formula/ionic.rb")
          src  = path.read_text()

          # Build the URL outright rather than rewriting the old one in place:
          # the old one carries the owner we are trying to correct.
          tarball = f"ionic-{version}-aarch64-apple-darwin.tar.gz"
          new_url = (
              f"https://github.com/{source_repo}/releases/download/{version}/{tarball}"
          )

          url_re = re.compile(
              r'https://github\.com/[^/"\s]+/[^/"\s]+/releases/download/[^"\s]+'
          )
          m = url_re.search(src)
          if not m:
              sys.exit("no GitHub release URL found in Formula/ionic.rb")
          old_url = m.group(0)

          src = src.replace(old_url, new_url)

          # The homepage carries the same stale owner, so correct it too.
          src, hp = re.subn(
              r'(homepage\s+"https://github\.com/)[^/"\s]+/[^/"\s]+(")',
              lambda mm: mm.group(1) + source_repo + mm.group(2),
              src,
              count=1,
          )
          if hp == 0:
              sys.exit("no homepage line found in Formula/ionic.rb")

          # Replace the sha256 that follows the URL, whatever its current value.
          src, n = re.subn(
              r'(url\s+"[^"]+"\s*\n\s*sha256\s+")[0-9a-fA-F]+(")',
              lambda mm: mm.group(1) + sha_arm + mm.group(2),
              src,
              count=1,
          )
          if n == 0:
              sys.exit("no sha256 line found after the release URL")

          # Keep a `version` line in sync if the formula has one. It is optional:
          # Homebrew can read the version from the URL.
          #
          # The tag carries a leading `v` (`v0.3.1`) but the formula must not.
          # Homebrew's own audit rule forbids it (rubocops/version.rb: "should
          # not have a leading 'v'"), and it is not cosmetic:
          # Version.new("v0.3.1") != Version.new("0.3.1"), so the keg is named
          # `v0.3.1` and any comparison against a `v`-less version is wrong.
          # Only the *version line* is stripped — the release URL legitimately
          # keeps the tag as-is, and the release job's read-back greps the URL.
          formula_version = version[1:] if version.startswith("v") else version
          if re.search(r'^\s*version\s+"', src, re.M):
              src = re.sub(r'^(\s*version\s+")[^"]+(")',
                           lambda mm: mm.group(1) + formula_version + mm.group(2),
                           src, count=1, flags=re.M)

          path.write_text(src)
          print(f"Rewrote formula to {version}")
          print(f"  repo: {source_repo}")
          print(f"  url: {new_url}")
          print(f"  sha256: {sha_arm}")
          PYEOF

          # Prove it, rather than assuming the regex landed.
          grep -q "github.com/${SOURCE_REPO}/releases/download/${VERSION}/" Formula/ionic.rb \
            || { echo "formula does not point at ${SOURCE_REPO} ${VERSION} after rewrite" >&2; exit 1; }
          grep -q "homepage \"https://github.com/${SOURCE_REPO}\"" Formula/ionic.rb \
            || { echo "formula homepage still points at the old owner" >&2; exit 1; }
          grep -q "${SHA_ARM}" Formula/ionic.rb \
            || { echo "formula does not carry the new sha256" >&2; exit 1; }
          # Homebrew rejects a leading `v` in `version`, and it is not cosmetic:
          # Version.new("v0.3.1") != Version.new("0.3.1"). Assert the absence
          # rather than trusting the rewrite above to have applied.
          if grep -qE '^[[:space:]]*version[[:space:]]+"v' Formula/ionic.rb; then
            echo "Formula version still has a leading 'v'; Homebrew forbids it." >&2
            grep -E '^[[:space:]]*version[[:space:]]' Formula/ionic.rb >&2
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ionic.rb
          if git diff --staged --quiet; then
            echo "Formula already at ${{ github.event.client_payload.version }}"
            exit 0
          fi
          git commit -m "ionic ${{ github.event.client_payload.version }}"
          git push
